              <div className="mt-8 text-[1.0625rem] leading-[1.85] text-gray-900">
                <p className="first-letter:float-left first-letter:mr-3 first-letter:mt-1 first-letter:text-6xl first-letter:font-black first-letter:leading-[0.8]" style={{}}>
                  Der Geburtenrückgang erreicht ein historisches Tief, und die Wirtschaft schlägt Alarm: Es fehlt nicht nur an Fachkräften, sondern an der nächsten Generation von Konsumenten und Steuerzahlern. Um den drohenden Systemkollaps abzuwenden, starten Bund und führende Banken heute die sogenannte „Demografie-Förderrichtlinie“. Paare können sich ab sofort massive finanzielle Vorteile sichern.
                </p>
                <p className="mt-5">
                  Doch das Geld fließt nicht bedingungslos. Die Voraussetzung: Familienplanung wird zur logistischen Mathematik. Antragsteller müssen ihre gesamten Finanzen und Lebenspläne in den neuen staatlichen „Timeline-Optimizer“ einspeisen.
                </p>

    function App() {
      const [screen, setScreen] = React.useState("news");
      const goToPortal = () => {
        let inIframe = false;
        try { inIframe = window.parent !== window; } catch (e) { inIframe = false; }
        if (inIframe) {
          window.parent.postMessage("dfr-go-portal", "*");
        } else {
          setScreen("portal");
        }
      };
      React.useEffect(() => { window.scrollTo(0, 0); }, [screen]);
      if (screen === "news") return <NewsPage onGoPortal={goToPortal} />;
      if (screen === "portal") return <PortalPage onGoWizard={() => setScreen("wizard")} />;
      return React.createElement(MainWizard);
    }
