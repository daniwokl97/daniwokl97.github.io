                      <p key="c">Grundlage der Zuteilung ist die durch den staatlichen Timeline-Optimizer ermittelte systemische Machbarkeit Ihrer Lebensziele. Die Förderung wird ausschließlich nach Annahme der algorithmisch generierten, rechtsbindenden Kompromissvorschläge gewährt.</p>
                    ]
                  },
                  {
                    t: "Fördervoraussetzungen", b: [
                      <p key="a" className="font-semibold">Wer kann die Förderung beantragen?</p>,
                      <p key="b">Antragsberechtigt sind volljährige Privatpersonen mit gewöhnlichem Aufenthalt im Inland. Bei eingetragener Partnerschaft ist der Antrag gemeinsam zu stellen; beide Personen gelten als gesamtschuldnerisch verpflichtet.</p>,
                      <p key="c" className="mt-4 font-semibold">Was brauchen Sie für die Antragstellung?</p>,
                      <p key="d">Für die Antragstellung ist die zwingende Verknüpfung Ihrer Bankkonten sowie der Konten Ihrer eingetragenen Partnerin / Ihres eingetragenen Partners erforderlich. Die Identifizierung erfolgt über ein BundID-Konto mit dem Vertrauensniveau „hoch“ (Online-Ausweis).</p>
                    ]
                  },
                  { t: "Förderfähigkeit", b: [<p key="a">Förderfähig sind Lebensentwürfe, deren Vereinbarkeit von Karriere, Wohneigentum und Kindererziehung durch den Timeline-Optimizer mit einem Gesamtscore von über 70 bewertet wurde.</p>] },
                  { t: "Finanzierung", b: [<p key="a">Die Zuwendung wird als nicht rückzahlbarer Zuschuss im Wege der Festbetragsfinanzierung gewährt. Die Höhe der Förderung wird in Abhängigkeit von der ermittelten Ressourcen-Allokation, dem zu versteuernden Haushaltsjahreseinkommen sowie der geplanten Anzahl der im Haushalt lebenden Kinder gestaffelt.</p>] },
                  { t: "Rechtliches", b: [<p key="a">Den rechtlichen Rahmen bildet die Richtlinie zur sozial gestaffelten Demografie-Förderung (DFR-38) vom 14.09.2038. Die Förderrichtlinie ist auf der Internetseite der Bundesagentur für Demografie und Lebenslaufplanung (BADL) veröffentlicht.</p>] },
                ].map(s => (
                  <section key={s.t} className="mt-10">
                    <h2 className="text-[26px] font-normal" style={{ fontFamily: 'Georgia, "Times New Roman", serif', color: "#111" }}>{s.t}</h2>
                    <div className="mt-4 space-y-3 text-[16px] leading-[1.7] text-[#2a2a2a]">{s.b}</div>
                  </section>
                ))}
              </article>
              <aside className="space-y-8">
                <button onClick={onGoWizard} className="flex w-full items-center justify-center gap-2 rounded-[3px] px-6 py-3.5 text-[16px] font-semibold text-white hover:brightness-110" style={{ background: NAVY_C }}>
                  Antrag stellen <IcChevR size={14} />
                </button>
                <section>
                  <h2 className="mb-3 text-[20px] font-bold" style={{ color: "#111" }}>Kontakt</h2>
                  <p className="text-[15px] text-[#333]">Noch Fragen?</p>
                  <p className="text-[15px] text-[#333]">Kontaktieren Sie den Projektträger.</p>
                  <p className="mt-4 text-[15px] font-bold">Bundesagentur für Demografie und Lebenslaufplanung (BADL) Außenstelle Weißwasser/Oberlausitz</p>
                  <p className="mt-3 text-[15px] text-[#333]">Friedrich-Bodelschwingh-Straße 15</p>
                  <p className="text-[15px] text-[#333]">02943 Weißwasser/Oberlausitz</p>
                  <p className="mt-4 flex items-center gap-2 text-[15px]" style={{ color: LINK_C }}><IcPhone size={14} /><a href="#" className="hover:underline">+49 3576 208-1028</a></p>
                  <p className="mt-2 flex items-center gap-2 text-[15px]" style={{ color: LINK_C }}><IcMail size={14} /><a href="#" className="hover:underline">demografie@badl.bund.de</a></p>
                  <p className="mt-2 flex items-center gap-2 text-[15px]" style={{ color: LINK_C }}><IcExt size={14} /><a href="#" className="hover:underline">Zur Projektseite</a></p>
                </section>
                <section className="border-t border-[#e3e3e3] pt-6">
                  <h2 className="mb-4 text-[20px] font-bold">Auf einen Blick</h2>
                  <dl className="space-y-4 text-[15px]">
                    {[["Förderart", "Zuschuss"], ["Förderbereich", "Demografie und Lebenslaufplanung"], ["Förderberechtigte", "Privatpersonen"], ["Förderzeitraum", "14.09.2038 bis 01.01.2040"], ["Fördergeber", "Bundesagentur für Demografie und Lebenslaufplanung (BADL)"]].map(([l, v]) => (
                      <div key={l}><dt className="font-bold text-[#111]">{l}</dt><dd className="mt-0.5 text-[#333]">{v}</dd></div>
                    ))}
                  </dl>
                </section>
                <div className="flex gap-3 border-l-4 bg-[#f4f7fa] p-4 text-[14px] text-[#333]" style={{ borderColor: NAVY_C }}>
                  <IcInfo size={16} />
                  <p>Hinweis: Zur Nutzung dieses Dienstes ist die Verknüpfung Ihrer Bankkonten sowie der Konten Ihrer eingetragenen Partnerin / Ihres eingetragenen Partners zwingend erforderlich.</p>
                </div>
              </aside>
            </div>
          </main>
          <footer style={{ background: NAVY_C }} className="text-white">
            <div className="mx-auto max-w-[1200px] px-4 py-8">
              <ul className="flex flex-wrap gap-x-6 gap-y-2 text-[14px] text-white/85">
                {["Impressum", "Datenschutz", "Barrierefreiheit", "Kontakt"].map(l => <li key={l}><a href="#" className="hover:underline">{l}</a></li>)}
              </ul>
              <p className="mt-6 text-[12px] leading-relaxed text-white/50">© 2038 Bundesagentur für Demografie und Lebenslaufplanung (BADL). Fiktive Publikation im Rahmen eines Design-Fiction-Projekts.</p>
            </div>
          </footer>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = React.useState("portal");
      React.useEffect(() => { window.scrollTo(0, 0); }, [screen]);
      if (screen === "news") return <NewsPage onGoPortal={() => setScreen("portal")} />;
      if (screen === "portal") return <PortalPage onGoWizard={() => setScreen("wizard")} />;
      return React.createElement(MainWizard);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
